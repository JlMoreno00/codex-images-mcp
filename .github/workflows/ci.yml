name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev deps
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

  pi-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pi-codex-images
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/pi-codex-images/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Check published files
        run: npm pack --dry-run

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t codex-images-mcp:ci .

      - name: Refuses public bind without a token
        env:
          EXPECTED: Refusing to listen on 0.0.0.0 without
        run: |
          set +e
          docker run --rm codex-images-mcp:ci > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          test "$code" -eq 2
          grep -q "$EXPECTED CODEX_IMAGES_HTTP_TOKEN" out.txt

      - name: Serves MCP behind the bearer token
        env:
          URL: http://127.0.0.1:8324/mcp/
        run: |
          docker run -d --name cim -p 8324:8324 \
            -e CODEX_IMAGES_HTTP_TOKEN=ci-token codex-images-mcp:ci
          status() { curl -s -o /dev/null -w '%{http_code}' -X POST "$URL"; }
          for _ in $(seq 1 30); do
            [ "$(status || true)" = "401" ] && break
            sleep 1
          done
          test "$(status)" = "401"
          docker rm -f cim
