[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-images-mcp"
version = "0.1.0"
description = "Self-hosted MCP server for Codex Images (gpt-image-2 on your ChatGPT plan): stdio and HTTP, verifiable artifacts, masks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "wauwa" },
    { name = "JlMoreno00" },
]
keywords = [
    "image generation",
    "codex",
    "openai",
    "mcp",
    "ai",
    "gpt-image",
    "cli",
    "sdk",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "codex-image-gen >= 0.2.1",
    "Pillow >= 10.0",
    "click >= 8.1",
    "mcp >= 1.27, < 2",
    "tomli-w >= 1.0",
]

[project.urls]
Homepage = "https://github.com/JlMoreno00/codex-images-mcp"
Repository = "https://github.com/JlMoreno00/codex-images-mcp"
Issues = "https://github.com/JlMoreno00/codex-images-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest >= 8",
    "pytest-mock",
    "pyyaml",
]

[project.scripts]
codex-images-mcp = "codex_images_mcp.cli:main_group"
codex-images-mcp-server = "codex_images_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_images_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
