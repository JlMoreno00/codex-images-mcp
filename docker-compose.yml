# Example deployment. Put a TLS reverse proxy (Caddy, nginx, Traefik) in front
# and point CODEX_IMAGES_PUBLIC_BASE_URL at its public HTTPS origin if you want
# signed downloads for large artifacts.
services:
  codex-images:
    build: .
    image: ghcr.io/jlmoreno00/codex-images-mcp:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8324:8324"
    environment:
      CODEX_IMAGES_HTTP_TOKEN: ${CODEX_IMAGES_HTTP_TOKEN:?set a random token}
      # CODEX_IMAGES_PUBLIC_BASE_URL: https://images.example.com
    volumes:
      # Codex sign-in (auth.json) and generated artifacts.
      - ./data:/data
